name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler la derniere version
        run: |
          ver() { grep -o 'VERSION: *"[0-9.]*"' "$1" 2>/dev/null | grep -o '[0-9.]*' | tail -1; }
          D=$(ls -d "Kabylos Notes de frais"*/ 2>/dev/null | sort -V | tail -1)
          mkdir _site
          if [ -n "$D" ]; then cp -r "$D". _site/; fi
          VD=$(ver "_site/config.js"); VR=$(ver "config.js")
          echo "dossier=$D ($VD) racine=($VR)"
          if [ -n "$VR" ] && [ "$(printf '%s\n%s\n' "${VD:-0}" "$VR" | sort -V | tail -1)" = "$VR" ]; then
            for f in *.js *.html *.webmanifest *.png; do [ -f "$f" ] && cp "$f" _site/; done
            for d in icons vendor; do [ -d "$d" ] && cp -r "$d" _site/; done
          fi
          ls -la _site; grep VERSION _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
