name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prendre la dernière version
        run: |
          D=$(ls -d "Kabylos Notes de frais"*/ 2>/dev/null | sort -V | tail -1)
          mkdir _site
          if [ -n "$D" ]; then cp -r "$D". _site/; else cp -r index.html *.js manifest.webmanifest icons vendor _site/; fi
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
